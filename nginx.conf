map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 10 MB by the API (FileStorage:MaxFileSizeBytes).
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Student Assistant agent (DigitalSchoolManagementSystem-Agent). LLM turns can take a while;
    # proxy_read_timeout must stay above the agent's Agent:RequestTimeoutSeconds (90s).
    # The upstream is a variable so nginx resolves it per request (Docker's DNS at 127.0.0.11)
    # instead of at startup - the site still starts and works if the agent container is down.
    location /agent/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_upstream http://agent:8080;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 100s;
    }

    # SignalR (WebSocket upgrade for the notification hub)
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: any unknown path falls back to index.html
    location / {
        try_files $uri /index.html;
    }
}
